# paddocks configuration.
#
# Copy to ~/.config/paddocks.toml and edit, or generate a starting point
# from whatever is already on your desktop:
#
#     paddocks discover > ~/.config/paddocks.toml

[settings]
# row    - groups side by side, wrapping when they run out of width
# grid   - three per row
# column - one per row
arrangement = "row"

# center - each row centred on screen, mixed-height groups centred within it
# left   - rows start at the left margin, groups aligned to the top
align = "center"

# Refuse to build rather than quietly dropping an app whose launcher no longer
# resolves -- worth having if any of your entries are hand-written .desktop
# files, which break silently when what they point at moves. `--no-strict`
# gets past it for one run.
# strict = true

# Layout tuning. Defaults measured against Plasma 6.6. max_columns caps how
# wide a group gets before it wraps to a second icon row.
# cell = 140
# max_columns = 4
# margin = 60
# gap = 24
# top = 48

# A group is either a list of apps or a folder, never both.
#
# `apps` are .desktop ids, with or without the extension, looked up in the
# usual application directories plus the flatpak and snap export paths. The
# match is forgiving: "firefox" finds firefox_firefox from a snap, "krita"
# finds org.kde.krita, and an id that matches nothing is reported with the
# nearest candidates. These become a Quicklaunch widget.
#
# `path` instead makes the group show a real folder, live -- add a file to the
# folder and it appears on the desktop, with no `paddocks apply` in between.
# These become a Folder View widget. A folder that does not exist yet is a
# warning, not an error, so a path on an unmounted drive fills in when it
# turns up.
#
# Group names must be unique -- they are the widget titles.

[[group]]
name = "Internet"
apps = ["firefox", "thunderbird"]

[[group]]
name = "Office"
apps = ["libreoffice-writer", "libreoffice-calc", "org.kde.kcalc"]

[[group]]
name = "Graphics"
apps = ["org.kde.krita", "gimp"]

[[group]]
name = "Dev Tools"
apps = ["code", "org.kde.konsole"]

# A folder group. ~ and $VARS are expanded; keep the ~ rather than writing the
# absolute path and the config stays portable between machines.
[[group]]
name = "Downloads"
path = "~/Downloads"

# Folder contents change under you, so there is no count to size from. `cells`
# is how many icon slots to size the box for -- the folder scrolls past that
# rather than growing. Defaults to 8.
# [[group]]
# name = "Screenshots"
# path = "~/Pictures/Screenshots"
# cells = 12

# `screen` puts a group on another monitor. The index is Plasma's numbering,
# which is not the physical order -- `paddocks screens` prints it. Left out, a
# group goes on screen 0.
# [[group]]
# name = "Reference"
# screen = 1
# path = "~/Documents/Reference"
