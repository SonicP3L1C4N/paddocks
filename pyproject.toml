[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paddocks"
dynamic = ["version"]
description = "Grouped desktop launcher panels for KDE Plasma 6, built out of stock Plasma widgets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gary Bissett", email = "gary.bissett@gmail.com" }]
keywords = ["kde", "plasma", "desktop", "launcher", "quicklaunch", "widgets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: KDE",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
]

# The command line is stdlib-only by design; only the editor needs Qt.
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]

[project.scripts]
paddocks = "paddocks.cli:main"

[project.urls]
Homepage = "https://github.com/SonicP3L1C4N/paddocks"
Source = "https://github.com/SonicP3L1C4N/paddocks"
Issues = "https://github.com/SonicP3L1C4N/paddocks/issues"

[tool.hatch.version]
path = "paddocks/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["paddocks"]

# Icons live at the repo root because the README references them from there.
# An installed copy has no repo root, so the wheel carries them inside the
# package instead -- see `desktop._icon_source`.
[tool.hatch.build.targets.wheel.force-include]
"icons" = "paddocks/icons"

[tool.hatch.build.targets.sdist]
include = [
    "paddocks",
    "bin",
    "icons",
    "docs",
    "tests",
    "paddocks.example.toml",
    "README.md",
    "LICENSE",
]
